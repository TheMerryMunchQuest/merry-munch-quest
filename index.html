<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Merry Munch Quest</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff8ec;color:#244c3d}*{box-sizing:border-box}body{margin:0}header{padding:25px 14px;text-align:center;background:linear-gradient(110deg,#9d233a,#c13d4b 60%,#145843);color:#fff}h1{margin:3px 0;font-size:clamp(27px,5vw,40px)}header p{margin:4px}.wrap{max-width:1050px;margin:auto;padding:16px}section,.card{background:white;border:1px solid #e9dfcb;border-radius:16px;padding:17px;margin:10px 0;box-shadow:0 3px 10px #2221}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{max-width:100%}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#e9efe7;color:#204a3a;font-weight:700}button.primary,button.active{background:#a5233a;color:white}button:disabled{opacity:.5;cursor:default}input,select{border:1px solid #b7c5b9;border-radius:9px;padding:10px;background:white;max-width:100%}input[type=email],input[type=password]{width:100%}label{display:block;font-size:13px;font-weight:700;margin:9px 0 4px}.muted{color:#617368;font-size:13px}.error{color:#9c2135}.success{color:#14643b}.notice{background:#fff2d7;padding:12px;border-radius:10px}.tag{display:inline-block;background:#f5e9d3;border-radius:20px;padding:4px 9px;font-size:12px;margin:2px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.choices button{font-size:12px;padding:10px 5px}.choices .picked{background:#145843;color:#fff}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}h2{margin-top:0}footer{text-align:center;padding:24px;color:#657468;font-size:12px}.mapland{border-left:5px solid #a5233a;padding-left:12px}.stat{background:#f1f4eb;padding:12px;border-radius:12px;text-align:center;flex:1;min-width:110px}.stat b{display:block;font-size:26px}@media(max-width:500px){.wrap{padding:10px}section,.card{padding:13px}}
</style></head><body><header><div>🎄 🍭 ✨</div><h1>The Merry Munch Quest</h1><p>Making spirits bright, one Disney bite at a time!</p></header><main class="wrap"><div id="app">Loading...</div></main><footer>Independent family planner; not affiliated with Disney. Availability subject to change; check official menus before ordering.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const CONFIG={url:'https://uxbtycyfoamnganlkhoj.supabase.co',key:'sb_publishable_EVQDqjW09PbWiTanVUqfRA_SVGibd1I'};
const sb=window.supabase.createClient(CONFIG.url,CONFIG.key);const el=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let user=null,trips=[],trip=null,people=[],menu=[],wishes=[],activePerson='',tab='plan',park='All',land='All',place='All',category='All',search='';let status='';function say(msg){status=msg;render()}function err(e){say('⚠️ '+(e?.message||e))}async function load(){const {data:{user:u}}=await sb.auth.getUser();user=u;if(!user){render();return}try{const a=await sb.from('trip_members').select('trip_id,role,trips(id,name)').eq('user_id',user.id);if(a.error)throw a.error;trips=a.data||[];if(trip&&!trips.some(x=>x.trip_id===trip))trip=null;if(!trip&&trips.length)trip=trips[0].trip_id;if(trip){const [p,m,w]=await Promise.all([sb.from('participants').select('*').eq('trip_id',trip).order('created_at'),sb.from('menu_items').select('*').order('park').order('land'),sb.from('wishes').select('participant_id,menu_item_id,priority')]);for(const q of [p,m,w])if(q.error)throw q.error;people=p.data;menu=m.data;wishes=w.data;activePerson=people.some(x=>x.id===activePerson&&x.managed_by===user.id)?activePerson:(people.find(x=>x.managed_by===user.id)?.id||'')}else{people=[];menu=[];wishes=[]}render()}catch(e){err(e)}}
function render(){if(!user){el.innerHTML=`<section><h2>🔐 Welcome to your Christmas food adventure</h2><p>Sign in or create an adult account. Children will have profiles managed by an adult.</p><form id="auth"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="6" autocomplete="current-password"></label><div class="row"><button class="primary" name="action" value="login">Sign in</button><button name="action" value="signup">Create account</button></div></form><p class="muted">If email confirmation is enabled, check your inbox after registering, then return to sign in.</p></section>${message()}`;bindAuth();return}let h=`<section><div class="row"><strong>🎅 ${esc(user.email)}</strong><button id="logout">Sign out</button></div></section>`;if(!trip){h+=`<section><h2>🎁 Create your first trip</h2><form id="create-trip"><label>Trip name<input name="name" required maxlength="120" value="Disneyland Christmas Food Quest"></label><button class="primary">Create my trip</button></form><p class="muted">Private invitations will be added next. Do not share account credentials.</p></section>${message()}`;el.innerHTML=h;bindCommon();return}h+=`<section><div class="row"><strong>Trip: ${esc(trips.find(t=>t.trip_id===trip)?.trips?.name||'Disneyland')}</strong>${trips.length>1?`<select id="trip-select">${trips.map(t=>`<option value="${t.trip_id}" ${trip===t.trip_id?'selected':''}>${esc(t.trips?.name)}</option>`).join('')}</select>`:''}</div></section><nav>${[['plan','🎁 Snack List'],['map','🗺️ Park Guide'],['group','⭐ Group Favorites'],['people','👨‍👩‍👧 Profiles'],['memories','📸 Memories']].map(([t,l])=>`<button data-tab="${t}" class="${tab===t?'active':''}">${l}</button>`).join('')}</nav>`;if(tab==='people')h+=profiles();else if(tab==='plan')h+=planner();else if(tab==='map')h+=guide();else if(tab==='group')h+=group();else h+=`<section><h2>📸 Tasted & Treasured</h2><p>Our shared photo scrapbook is coming next. Photo uploads are intentionally disabled until we have secure storage policies in place.</p></section>`;el.innerHTML=h+message();bindCommon();}
function message(){return status?`<section role="status">${esc(status)}</section>`:''}function profiles(){return `<section><h2>👨‍👩‍👧 Family profiles</h2><p class="muted">Each adult manages their own profiles. Other group members can see them but cannot edit them.</p><div class="grid">${people.map(p=>`<div class="card"><b>${esc(p.display_name)}</b><span class="tag">${esc(p.profile_type)}</span><p class="muted">${p.managed_by===user.id?'Managed by you':'Another adult manages this profile'}</p>${p.managed_by===user.id?`<button data-delete-person="${p.id}">Remove</button>`:''}</div>`).join('')}</div><h3>Add yourself or your child</h3><form id="add-person"><label>Name or nickname<input name="name" required maxlength="60"></label><label>Profile type<select name="type"><option value="adult">Adult (me)</option><option value="child">Child I manage</option></select></label><button class="primary">Add profile</button></form></section>`}
function filterMenu(){return menu.filter(i=>i.verified&&(park==='All'||i.park===park)&&(land==='All'||i.land===land)&&(place==='All'||i.place===place)&&(category==='All'||i.category===category)&&[i.name,i.place,i.land,i.category].join(' ').toLowerCase().includes(search.toLowerCase()))}
function opts(values,selected){return values.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function tools(){const relevant=menu.filter(i=>i.verified&&(park==='All'||i.park===park));const lands=['All',...new Set(relevant.map(i=>i.land))].sort();const places=['All',...new Set(relevant.filter(i=>land==='All'||i.land===land).map(i=>i.place))].sort();const categories=['All',...new Set(relevant.map(i=>i.category))].sort();return `<div class="row"><label>Park <select id="park">${opts(['All','Disneyland','California Adventure'],park)}</select></label><label>Land <select id="land">${opts(lands,land)}</select></label><label>Restaurant or cart <select id="place">${opts(places,place)}</select></label><label>Category <select id="category">${opts(categories,category)}</select></label><label>Search <input id="search" placeholder="Food or restaurant" value="${esc(search)}"></label></div><p class="muted">Showing ${filterMenu().length} verified selections. Holiday guide imports are still being expanded; regular menus are not yet complete.</p>`}
function pick(item,person){return wishes.find(w=>w.menu_item_id===item&&w.participant_id===person)?.priority||''}const names={must:'⭐ Gotta Have It!',maybe:'🍬 If Still Hungry',pass:'❄️ Could Pass'};function planner(){let mine=people.filter(p=>p.managed_by===user.id);return `<section><h2>🎁 Santa's Snack List</h2><p><b>Nov 20: Disneyland Park · Nov 21: Disney California Adventure</b></p><p>Choose yourself or a child, then save food wishes for your group.</p>${mine.length?`<label>Choose participant <select id="person">${mine.map(p=>`<option value="${p.id}" ${p.id===activePerson?'selected':''}>${esc(p.display_name)}</option>`).join('')}</select></label>`:'<p class="notice">First add yourself under Family Profiles, then return here.</p>'}${tools()}<p class="notice">🎄 Officially announced holiday selections for your Nov 20–21 visit. Regular menus and additional holiday offerings are still being added. Availability can change.</p></section><div class="grid">${filterMenu().map(i=>`<article class="card"><span class="tag">${esc(i.park)}</span><span class="tag">${esc(i.land)}</span><span class="tag">🎄 Holiday 2026</span><h3>${esc(i.name)}</h3><div class="muted">${esc(i.place)} · ${esc(i.category)} · <a href="${esc(i.source_url||'#')}" target="_blank" rel="noopener noreferrer">Official Disney source</a></div>${activePerson?`<div class="choices">${Object.entries(names).map(([k,n])=>`<button data-item="${i.id}" data-priority="${k}" class="${pick(i.id,activePerson)===k?'picked':''}">${n}</button>`).join('')}<button data-item="${i.id}" data-priority="" class="${!pick(i.id,activePerson)?'picked':''}">No thanks</button></div>`:''}<p class="muted">${people.filter(p=>pick(i.id,p.id)).map(p=>esc(p.display_name)+': '+names[pick(i.id,p.id)]).join(' · ')||'No wishes yet'}</p></article>`).join('')}</div>`}
function guide(){const selected=filterMenu().filter(i=>people.some(p=>pick(i.id,p.id)));const lands=[...new Set(selected.map(i=>i.park+'|'+i.land))];return `<section><h2>🗺️ Merry Munch Park Guide</h2><p class="muted">Grouped by park and land. Geographic map pins will be added only with verified coordinates.</p>${tools()}</section>${lands.map(k=>{let [p,l]=k.split('|');return `<section class="mapland"><h3>📍 ${esc(p)} — ${esc(l)}</h3>${selected.filter(i=>i.park===p&&i.land===l).map(i=>`<div class="card"><b>${esc(i.place)} — ${esc(i.name)}</b><p>${people.filter(x=>pick(i.id,x.id)).map(x=>`${esc(x.display_name)}: ${names[pick(i.id,x.id)]}`).join('<br>')}</p></div>`).join('')}</section>`}).join('')||'<section>No group wishes yet.</section>'}`}
function group(){let selected=menu.filter(i=>i.verified&&people.some(p=>pick(i.id,p.id))).sort((a,b)=>score(b)-score(a));return `<section><h2>⭐ Group Favorites</h2><div class="row"><div class="stat"><b>${people.length}</b>People</div><div class="stat"><b>${wishes.length}</b>Wishes</div><div class="stat"><b>${wishes.filter(w=>w.priority==='must').length}</b>Must-haves</div></div></section><section><h3>Most wanted treats (highest combined interest first)</h3>${selected.map(i=>`<div class="card"><b>${esc(i.name)}</b><div class="muted">${esc(i.place)} · ${esc(i.park)}</div><p>${people.filter(p=>pick(i.id,p.id)).map(p=>esc(p.display_name)+' ('+names[pick(i.id,p.id)]+')').join(' · ')}</p></div>`).join('')||'No wishes yet.'}</section>`}function score(i){return people.reduce((s,p)=>s+({must:3,maybe:2,pass:1}[pick(i.id,p.id)]||0),0)}
function bindAuth(){document.getElementById('auth').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),action=e.submitter?.value||'login',email=f.get('email'),password=f.get('password');try{const r=action==='signup'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(action==='signup'&&!r.data.session)say('Account created. Please confirm your email, then sign in.');else await load()}catch(e){err(e)}})}function bindCommon(){document.getElementById('logout')?.addEventListener('click',async()=>{await sb.auth.signOut();trip=null;status='';await load()});document.getElementById('create-trip')?.addEventListener('submit',async e=>{e.preventDefault();const name=new FormData(e.target).get('name');const r=await sb.rpc('create_trip',{p_name:name});if(r.error)return err(r.error);trip=r.data;status='Trip created! Add your family profiles.';tab='people';await load()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;status='';render()});document.getElementById('trip-select')?.addEventListener('change',async e=>{trip=e.target.value;await load()});document.getElementById('add-person')?.addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim(),type=f.get('type');let r=await sb.from('participants').insert({trip_id:trip,managed_by:user.id,display_name:name,profile_type:type});if(r.error)return err(r.error);status='Profile saved!';await load()});document.querySelectorAll('[data-delete-person]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this profile and its wishes?'))return;let r=await sb.from('participants').delete().eq('id',b.dataset.deletePerson);if(r.error)return err(r.error);await load()});document.getElementById('person')?.addEventListener('change',e=>{activePerson=e.target.value;render()});document.getElementById('park')?.addEventListener('change',e=>{park=e.target.value;land='All';place='All';render()});document.getElementById('land')?.addEventListener('change',e=>{land=e.target.value;place='All';render()});document.getElementById('place')?.addEventListener('change',e=>{place=e.target.value;render()});document.getElementById('category')?.addEventListener('change',e=>{category=e.target.value;render()});if(document.getElementById('park'))document.getElementById('park').value=park;document.getElementById('search')?.addEventListener('input',e=>{search=e.target.value;let pos=e.target.selectionStart;render();let inp=document.getElementById('search');inp?.focus();inp?.setSelectionRange(pos,pos)});document.querySelectorAll('[data-item]').forEach(b=>b.onclick=async()=>{if(!activePerson)return;let id=b.dataset.item,priority=b.dataset.priority;let r=priority?await sb.from('wishes').upsert({participant_id:activePerson,menu_item_id:id,priority},{onConflict:'participant_id,menu_item_id'}):await sb.from('wishes').delete().eq('participant_id',activePerson).eq('menu_item_id',id);if(r.error)return err(r.error);await load()})}
sb.auth.onAuthStateChange((_event,session)=>{if(!session&&user){user=null;trip=null;render()}});load();setInterval(()=>{if(user&&trip)load()},15000);
</script></body></html>
